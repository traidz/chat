<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Chat Support Traidz</title>
    <style>
        @keyframes messagePopIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.9); }
            70% { transform: translateY(-4px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            background: #1e1e1e;
            border: 2px solid #444;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 90vh;
        }

        .browser-tabs {
            background: #181818;
            display: flex;
            padding: 8px 8px 0 8px;
            gap: 6px;
            border-bottom: 2px solid #333;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .browser-tab {
            background: #252525;
            color: #aaa;
            padding: 8px 16px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #333;
            border-bottom: none;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }

        .browser-tab:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .browser-tab.active {
            background: #1e1e1e;
            color: #fff;
            border-color: #555;
            border-bottom: 2px solid #1e1e1e;
            font-weight: bold;
        }

        .chat-header {
            background: #1e1e1e;
            border-bottom: 2px solid #333;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }

        .user-settings {
            font-size: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #444; }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #121212;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }
        .tab-content.active {
            display: flex;
        }

        .message-item {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            animation: messagePopIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .message-left {
            align-self: flex-start;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ffffff;
            border-bottom-left-radius: 6px;
        }

        .message-right {
            align-self: flex-end;
            background: #2b2b2b;
            border: 1px solid #444;
            color: #ffffff;
            border-bottom-right-radius: 6px;
        }

        .message-header {
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            background-color: #0095f6;
            border-radius: 50%;
            color: white;
            flex-shrink: 0;
        }
        .admin-badge svg { width: 9px; height: 9px; fill: white; }

        .message-body {
            font-size: 14px;
            word-break: break-all;
            color: #ffffff;
        }

        .message-body img {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 10px;
            margin-top: 6px;
            cursor: pointer;
            display: block;
        }

        .message-body a { color: #4da6ff; text-decoration: underline; }
        .message-body a:hover { color: #80bfff; }

        .message-time {
            font-size: 10px;
            color: #aaaaaa;
            margin-top: 4px;
            align-self: flex-end;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #181818;
            border-top: 2px solid #333;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: #2a2a2a;
            border: 2px solid #555;
            color: white;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
        }

        .icon-upload-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 9px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .icon-upload-btn:hover { background: #444; }

        .chat-input-area button.send-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .chat-input-area button.send-btn:hover { background: #2980b9; }

        /* Modal Hộp thoại */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e;
            border: 2px solid #444;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
        }
        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-body label {
            font-size: 13px;
            color: #ccc;
        }
        .modal-body input[type="text"], .modal-body input[type="password"] {
            padding: 10px 14px;
            background: #2a2a2a;
            border: 1px solid #555;
            color: #fff;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }
        .password-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-box input {
            width: 100%;
            padding-right: 45px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
        }
        .toggle-password:hover { color: #fff; }
        
        .modal-footer {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .modal-btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
        }
        .modal-btn.primary { background: #3498db; color: white; }
        .modal-btn.primary:hover { background: #2980b9; }
        .modal-btn.secondary { background: #333; color: #ccc; border: 1px solid #555; }
        .modal-btn.secondary:hover { background: #444; color: #fff; }

        .auth-note {
            font-size: 12px;
            color: #3498db;
            background: rgba(52, 152, 219, 0.1);
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #3498db;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .color-picker-group input[type="color"] {
            border: none;
            width: 40px;
            height: 35px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="browser-tabs">
        <div class="browser-tab active" onclick="switchTab('tab-general', this)">💬 Chat Tổng Hợp</div>
        <div class="browser-tab" onclick="switchTab('tab-admin', this)">🔒 Nhắn Riêng Admin</div>
        <div class="browser-tab" onclick="switchTab('tab-news', this)">📢 Kênh Thông Báo</div>
    </div>

    <div class="chat-header">
        <span id="room-title">Phòng Chat Support Traidz</span>
        <div class="user-settings">
            <span id="user-label">Tài khoản: ...</span>
            <button class="action-btn" onclick="openWelcomeModal()" title="Đăng nhập / Đăng ký">🔄 Đổi Tài Khoản</button>
            <button class="action-btn" onclick="exportChatFile()" title="Lưu lịch sử">💾 Lưu</button>
            <button class="action-btn" onclick="document.getElementById('importFile').click()" title="Tải file">📂 Tải</button>
            <input type="file" id="importFile" style="display: none" accept=".txt" onchange="importChatFile(event)">
        </div>
    </div>

    <div id="tab-general" class="tab-content active">
        <div class="chat-messages" id="messagesList-general"></div>
        <div class="chat-input-area">
            <button class="icon-upload-btn" onclick="document.getElementById('fileInput-general').click()" title="Gửi ảnh/tệp">📎</button>
            <input type="file" id="fileInput-general" style="display: none" accept="image/*,.pdf,.doc,.docx,.txt" onchange="handleFileUpload(event, 'general')">
            <input type="text" id="messageInput-general" placeholder="Nhập tin nhắn..." onkeypress="handleKeyPress(event, 'general')">
            <button class="send-btn" onclick="postMessage('general')">Gửi</button>
        </div>
    </div>

    <div id="tab-admin" class="tab-content">
        <div class="chat-messages" id="messagesList-admin"></div>
        <div class="chat-input-area">
            <button class="icon-upload-btn" onclick="document.getElementById('fileInput-admin').click()" title="Gửi ảnh/tệp">📎</button>
            <input type="file" id="fileInput-admin" style="display: none" accept="image/*,.pdf,.doc,.docx,.txt" onchange="handleFileUpload(event, 'admin')">
            <input type="text" id="messageInput-admin" placeholder="Nhắn riêng với Admin..." onkeypress="handleKeyPress(event, 'admin')">
            <button class="send-btn" onclick="postMessage('admin')">Gửi</button>
        </div>
    </div>

    <div id="tab-news" class="tab-content">
        <div class="chat-messages" id="messagesList-news"></div>
        <div class="chat-input-area" id="news-input-area" style="display: none;">
            <button class="icon-upload-btn" onclick="document.getElementById('fileInput-news').click()" title="Gửi ảnh/tệp">📎</button>
            <input type="file" id="fileInput-news" style="display: none" accept="image/*,.pdf,.doc,.docx,.txt" onchange="handleFileUpload(event, 'news')">
            <input type="text" id="messageInput-news" placeholder="Đăng thông báo mới (Chỉ Admin)..." onkeypress="handleKeyPress(event, 'news')">
            <button class="send-btn" onclick="postMessage('news')">Đăng</button>
        </div>
    </div>
</div>

<!-- Modal 1: Màn hình chào mừng (Chọn Đăng Ký hoặc Đăng Nhập) -->
<div class="modal-overlay" id="welcomeModal">
    <div class="modal-content">
        <div class="modal-header">
            <span>Hệ Thống Xác Thực</span>
        </div>
        <div class="modal-body">
            <div class="auth-note">
                👋 Chào mừng bạn đến với phòng chat! Vui lòng chọn hành động tiếp tục bên dưới.
            </div>
        </div>
        <div class="modal-footer">
            <button class="modal-btn primary" onclick="showRegisterForm()">📝 Đăng Ký Tài Khoản Mới</button>
            <button class="modal-btn secondary" onclick="showLoginForm()">🔑 Đăng Nhập Tài Khoản</button>
        </div>
    </div>
</div>

<!-- Modal 2: Form Đăng Ký / Đăng Nhập cụ thể -->
<div class="modal-overlay" id="authModal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modalTitle">Đăng Ký Tài Khoản</span>
        </div>
        <div class="modal-body">
            <div class="auth-note" id="authNoteText">
                Điền thông tin để tạo tài khoản mới của bạn.
            </div>
            
            <label for="inputAuthName">Tên hiển thị:</label>
            <input type="text" id="inputAuthName" placeholder="Nhập tên của bạn...">
            
            <label for="inputAuthPass">Mật khẩu:</label>
            <div class="password-box">
                <input type="password" id="inputAuthPass" placeholder="Nhập mật khẩu...">
                <button type="button" class="toggle-password" id="togglePassBtn" onclick="togglePasswordVisibility()">👁️</button>
            </div>

            <div id="colorConfigSection">
                <label>Màu sắc tên của bạn:</label>
                <div class="color-picker-group">
                    <input type="color" id="inputAuthColor" value="#3498db">
                    <span style="font-size: 12px; color: #aaa;">Chọn màu hiển thị tên</span>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="modal-btn primary" id="authSubmitBtn" onclick="submitAuth()">Xác Nhận</button>
            <button class="modal-btn secondary" onclick="openWelcomeModal()">Quay Lại</button>
        </div>
    </div>
</div>

<script>
    const MY_NAME = "Traidz";
    let username = "";
    let userColor = "#3498db";
    let activeTab = "general";
    let authMode = "register"; // 'register' hoặc 'login'

    function checkUserSession() {
        let savedUser = localStorage.getItem('chat_current_user');
        let savedColor = localStorage.getItem('chat_current_color');

        let accounts = JSON.parse(localStorage.getItem('chat_accounts_db')) || {};
        // Đảm bảo tài khoản Admin Traidz luôn tồn tại sẵn không cần đăng ký
        if (!accounts[MY_NAME.toLowerCase()]) {
            accounts[MY_NAME.toLowerCase()] = "admin";
            localStorage.setItem('chat_accounts_db', JSON.stringify(accounts));
        }

        if (!savedUser) {
            openWelcomeModal();
        } else {
            username = savedUser;
            userColor = savedColor || "#3498db";
            document.getElementById('welcomeModal').style.display = 'none';
            document.getElementById('authModal').style.display = 'none';
            updateUserLabel();
            checkAdminNewsPermission();
            loadAllMessages();
        }
    }

    function openWelcomeModal() {
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('welcomeModal').style.display = 'flex';
    }

    function showRegisterForm() {
        authMode = "register";
        document.getElementById('welcomeModal').style.display = 'none';
        document.getElementById('modalTitle').innerText = "Đăng Ký Tài Khoản Mới";
        document.getElementById('authNoteText').innerText = "✨ Nhập tên và tự đặt mật khẩu để đăng ký tài khoản mới.";
        document.getElementById('colorConfigSection').style.display = 'block';
        document.getElementById('authSubmitBtn').innerText = "Đăng Ký Ngay";
        
        document.getElementById('inputAuthName').value = "";
        document.getElementById('inputAuthPass').value = "";
        document.getElementById('inputAuthColor').value = "#3498db";
        document.getElementById('authModal').style.display = 'flex';
    }

    function showLoginForm() {
        authMode = "login";
        document.getElementById('welcomeModal').style.display = 'none';
        document.getElementById('modalTitle').innerText = "Đăng Nhập Tài Khoản";
        document.getElementById('authNoteText').innerText = "🔑 Nhập chính xác tên và mật khẩu đã đăng ký để vào phòng chat.";
        document.getElementById('colorConfigSection').style.display = 'none'; // Đăng nhập dùng màu cũ hoặc mặc định
        document.getElementById('authSubmitBtn').innerText = "Đăng Nhập";
        
        document.getElementById('inputAuthName').value = "";
        document.getElementById('inputAuthPass').value = "";
        document.getElementById('authModal').style.display = 'flex';
    }

    function togglePasswordVisibility() {
        const passInput = document.getElementById('inputAuthPass');
        const btn = document.getElementById('togglePassBtn');
        if (passInput.type === "password") {
            passInput.type = "text";
            btn.innerText = "🙈";
        } else {
            passInput.type = "password";
            btn.innerText = "👁️";
        }
    }

    function submitAuth() {
        let inputName = document.getElementById('inputAuthName').value.trim();
        let inputPass = document.getElementById('inputAuthPass').value.trim();
        let inputColor = document.getElementById('inputAuthColor').value;

        if (!inputName) {
            alert("Vui lòng nhập tên hiển thị!");
            return;
        }

        if (!inputPass) {
            alert("Vui lòng nhập mật khẩu!");
            return;
        }

        let accounts = JSON.parse(localStorage.getItem('chat_accounts_db')) || {};
        let userKey = inputName.toLowerCase();

        // Riêng tài khoản Admin Traidz cho phép vào thẳng không cần mật khẩu rườm rà nếu muốn
        if (userKey === MY_NAME.toLowerCase()) {
            username = MY_NAME;
            userColor = "#ff4757";
            saveAndEnterSession();
            return;
        }

        if (authMode === "register") {
            if (accounts[userKey]) {
                alert("Tên tài khoản này đã được người khác đăng ký rồi! Vui lòng chọn tên khác hoặc chọn chế độ Đăng Nhập.");
                return;
            }
            if (inputPass.length < 3) {
                alert("Mật khẩu phải có ít nhất 3 ký tự!");
                return;
            }

            // Lưu tài khoản mới
            accounts[userKey] = inputPass;
            localStorage.setItem('chat_accounts_db', JSON.stringify(accounts));

            username = inputName;
            userColor = inputColor;
            saveAndEnterSession();

        } else {
            // Chế độ đăng nhập: Bắt buộc đúng tên và đúng mật khẩu
            if (!accounts[userKey]) {
                alert("Tên tài khoản này chưa tồn tại trong hệ thống! Vui lòng kiểm tra lại hoặc chuyển sang Đăng Ký.");
                return;
            }

            if (accounts[userKey] === inputPass) {
                username = inputName;
                // Nếu đăng nhập thì giữ lại màu cũ hoặc mặc định
                userColor = localStorage.getItem(`chat_color_${userKey}`) || "#3498db";
                saveAndEnterSession();
            } else {
                alert("Sai mật khẩu! Vui lòng kiểm tra lại mật khẩu của bạn.");
            }
        }
    }

    function saveAndEnterSession() {
        localStorage.setItem('chat_current_user', username);
        localStorage.setItem('chat_current_color', userColor);
        localStorage.setItem(`chat_color_${username.toLowerCase()}`, userColor);

        document.getElementById('welcomeModal').style.display = 'none';
        document.getElementById('authModal').style.display = 'none';
        updateUserLabel();
        checkAdminNewsPermission();
        loadAllMessages();
    }

    function updateUserLabel() {
        const userLabel = document.getElementById('user-label');
        if (username.toLowerCase() === MY_NAME.toLowerCase()) {
            userLabel.innerHTML = `Tài khoản: <span style="color: #ff4757; font-weight: bold;">Traidz</span>`;
        } else {
            userLabel.innerHTML = `Tài khoản: <span style="color: ${userColor}; font-weight: bold;">${escapeHTML(username)}</span>`;
        }
    }

    function checkAdminNewsPermission() {
        const newsInputArea = document.getElementById('news-input-area');
        if (username.toLowerCase() === MY_NAME.toLowerCase()) {
            newsInputArea.style.display = 'flex';
        } else {
            newsInputArea.style.display = 'none';
        }
    }

    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.browser-tab').forEach(el => el.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');

        activeTab = tabId.replace('tab-', '');
        loadMessages(activeTab);
    }

    function postMessage(room) {
        const input = document.getElementById(`messageInput-${room}`);
        const text = input.value.trim();
        if (text === "") return;

        saveAndRenderMessage(room, text, "text");
        input.value = "";
    }

    function handleFileUpload(event, room) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const fileData = e.target.result;
            let contentHtml = "";

            if (file.type.startsWith('image/')) {
                contentHtml = `<img src="${fileData}" alt="${escapeHTML(file.name)}">`;
            } else {
                contentHtml = `📁 <a href="${fileData}" download="${escapeHTML(file.name)}">${escapeHTML(file.name)}</a>`;
            }

            saveAndRenderMessage(room, contentHtml, "html");
        };
        reader.readAsDataURL(file);
        event.target.value = "";
    }

    function saveAndRenderMessage(room, content, type) {
        let storageKey = `chat_messages_v13_${room}`;
        let messages = JSON.parse(localStorage.getItem(storageKey)) || [];

        const now = new Date();
        const dateStr = now.toLocaleDateString();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const newMessage = {
            name: username,
            color: userColor,
            content: content,
            type: type,
            date: dateStr,
            time: timeStr
        };

        messages.push(newMessage);
        localStorage.setItem(storageKey, JSON.stringify(messages));
        loadMessages(room);
    }

    function loadMessages(room) {
        const messagesList = document.getElementById(`messagesList-${room}`);
        let storageKey = `chat_messages_v13_${room}`;
        const messages = JSON.parse(localStorage.getItem(storageKey)) || [];

        messagesList.innerHTML = "";

        messages.forEach(msg => {
            const div = document.createElement('div');
            const isMe = (msg.name === username);
            div.className = isMe ? 'message-item message-right' : 'message-item message-left';

            let nameHtml = "";
            let badgeHtml = "";

            if (msg.name.toLowerCase() === MY_NAME.toLowerCase()) {
                nameHtml = `<span style="color: #ff4757; font-weight: bold;">Traidz</span>`;
                badgeHtml = `
                    <span class="admin-badge" title="Tài khoản chính chủ Traidz">
                        <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
                    </span>
                `;
            } else {
                let col = msg.color || "#3498db";
                nameHtml = `<span style="color: ${col}; font-weight: bold;">${escapeHTML(msg.name)}</span>`;
            }

            let bodyContent = "";
            if (msg.type === "html") {
                bodyContent = msg.content;
            } else {
                bodyContent = linkify(escapeHTML(msg.content));
            }

            const displayTime = msg.date ? `${msg.date} - ${msg.time}` : msg.time;

            div.innerHTML = `
                <div class="message-header">
                    ${nameHtml}
                    ${badgeHtml}
                </div>
                <div class="message-body">${bodyContent}</div>
                <div class="message-time">${displayTime}</div>
            `;
            messagesList.appendChild(div);
        });

        messagesList.scrollTop = messagesList.scrollHeight;
    }

    function loadAllMessages() {
        loadMessages('general');
        loadMessages('admin');
        loadMessages('news');
    }

    function linkify(inputText) {
        let replacedText, replacePattern1, replacePattern2, replacePattern3;
        replacePattern1 = /(\b(https?|ftp):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gim;
        replacedText = inputText.replace(replacePattern1, '<a href="$1" target="_blank">$1</a>');
        replacePattern2 = /(^|[^\/])(www\.[\S]+(\b|$))/gim;
        replacedText = replacedText.replace(replacePattern2, '$1<a href="http://$2" target="_blank">$2</a>');
        replacePattern3 = /(([a-zA-Z0-9\-\_\.])+@[a-zA-Z\_]+?(\.[a-zA-Z]{2,6})+)/gim;
        replacedText = replacedText.replace(replacePattern3, '<a href="mailto:$1">$1</a>');
        return replacedText;
    }

    function handleKeyPress(event, room) {
        if (event.key === 'Enter') {
            postMessage(room);
        }
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    function exportChatFile() {
        let exportData = {
            accounts: JSON.parse(localStorage.getItem('chat_accounts_db')) || {},
            general: JSON.parse(localStorage.getItem('chat_messages_v13_general')) || [],
            admin: JSON.parse(localStorage.getItem('chat_messages_v13_admin')) || [],
            news: JSON.parse(localStorage.getItem('chat_messages_v13_news')) || []
        };

        let customName = prompt("Nhập tên file muốn lưu:", "du-lieu-chat-va-tai-khoan");
        if (!customName || customName.trim() === "") return;
        
        let fileName = customName.trim();
        if (!fileName.endsWith('.txt')) fileName += '.txt';

        let textContent = "=== CHAT SYSTEM BACKUP ===\n";
        textContent += "=== JSON_DATA_START ===\n" + JSON.stringify(exportData) + "\n=== JSON_DATA_END ===";

        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importChatFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const content = e.target.result;
                if (content.includes("=== JSON_DATA_START ===")) {
                    const jsonPart = content.split("=== JSON_DATA_START ===")[1].split("=== JSON_DATA_END ===")[0].trim();
                    const data = JSON.parse(jsonPart);

                    if (data.accounts) localStorage.setItem('chat_accounts_db', JSON.stringify(data.accounts));
                    if (data.general) localStorage.setItem('chat_messages_v13_general', JSON.stringify(data.general));
                    if (data.admin) localStorage.setItem('chat_messages_v13_admin', JSON.stringify(data.admin));
                    if (data.news) localStorage.setItem('chat_messages_v13_news', JSON.stringify(data.news));

                    alert("Khôi phục thành công! Vui lòng tải lại trang.");
                    location.reload();
                } else {
                    alert("File không hợp lệ hoặc sai định dạng lưu trữ!");
                }
            } catch (err) {
                alert("Lỗi đọc file!");
            }
        };
        reader.readAsText(file);
    }

    window.onload = function() {
        checkUserSession();
    };
</script>
